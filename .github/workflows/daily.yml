name: daily-refresh

on:
  schedule:
    - cron: "30 3 * * *"          # 03:30 UTC = 06:30 Athens
  workflow_dispatch:
    inputs:
      full:
        description: "Re-download every season in config.SEASONS"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: data-write
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Read esake.gr and rebuild the warehouse
        run: python -m pipeline.run ${{ inputs.full && '--full' || '' }}
      - name: Tests
        continue-on-error: true
        run: python -m pytest -q tests
      - name: Commit refreshed data
        run: |
          git config user.name "data-bot"
          git config user.email "data-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "data: daily refresh $(date -u +%F)"
          git pull --rebase && git push
